version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: acesso_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://acesso.local
      DB_HOST: db
      DB_DATABASE: acesso
      DB_USERNAME: acesso
      DB_PASSWORD: acesso
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:1.25-alpine
    container_name: acesso_nginx
    restart: unless-stopped
    ports:
      - '443:443'
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

  db:
    image: mariadb:11.3
    container_name: acesso_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: acesso
      MARIADB_USER: acesso
      MARIADB_PASSWORD: acesso
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
